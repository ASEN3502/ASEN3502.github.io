title: ASEN 3502
description: Aerospace Computational Methods — University of Colorado Boulder
url: https://asen3502.com
timezone: America/Denver

remote_theme: just-the-docs/just-the-docs@v0.10.1

# Sidebar / nav
#
# just-the-docs renders these at the top level of the sidebar, below every
# section. They cannot be nested inside a section, so every off-site
# destination lives here.
nav_external_links:
  - title: Announcements (Canvas)
    url: https://canvas.colorado.edu/courses/143236/announcements
  - title: Textbook
    url: https://cuboulder.vitalsource.com/home/my-courses
  - title: Gradescope
    url: https://www.gradescope.com/courses/1345824
  - title: Lecture Videos
    url: https://cu-classcapture.colorado.edu/Mediasite/Channel/683983461e524a1caa59bbba71598c8e5f/browse/null/most-recent/null/0/null

# Search bar (client-side, no external service)
search_enabled: true
search:
  heading_level: 2
  previews: 2
  tokenizer_separator: /[\s/]+/

# Callouts. Used as:
#     {: .construction }
#     > text of the callout
callouts_level: loud
callouts:
  construction:
    title: Under construction
    color: yellow

heading_anchors: true
color_scheme: cu # defined in _sass/color_schemes/cu.scss

aux_links:
  "GitHub": https://github.com/ASEN3502/ASEN3502.github.io

back_to_top: true
back_to_top_text: "Back to top"

# Footer text lives in _includes/footer_custom.html -- Liquid in _config.yml
# values is not evaluated, so a date has to be rendered from an include.

plugins:
  - jekyll-remote-theme

# NOTE: this replaces Jekyll's default exclude list rather than adding to it,
# so the vendor/ and Gemfile entries must be repeated here explicitly.
exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - build-pdf.sh
  - README.md
  - LICENSE
