title: ASEN 3502
description: Aerospace Computational Methods — University of Colorado Boulder
url: https://asen3502.com

remote_theme: just-the-docs/just-the-docs@v0.10.1

# Sidebar / nav
nav_external_links:
  - title: Canvas
    url: https://canvas.colorado.edu

# Search bar (client-side, no external service)
search_enabled: true
search:
  heading_level: 2
  previews: 2
  tokenizer_separator: /[\s/]+/

heading_anchors: true
color_scheme: cu # defined in _sass/color_schemes/cu.scss

aux_links:
  "GitHub": https://github.com/ASEN3502/ASEN3502.github.io

back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'ASEN 3502, CU Boulder. Last built {{ site.time | date: "%b %-d, %Y" }}.'

plugins:
  - jekyll-remote-theme

# NOTE: this replaces Jekyll's default exclude list rather than adding to it,
# so the vendor/ and Gemfile entries must be repeated here explicitly.
exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
